<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Pedidos - Pasterry</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; padding: 1em; background-color: #1A1210; color: #e6eef6; margin: 0; }
        h1 { margin: 0 0 16px 0; color: #07fcdb; }
        h3 { margin: 0 0 12px 0; border-bottom: 1px solid #444; padding-bottom: 8px; color: #07fcdb;}
        #lista {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 1em;
        }

        .pedido {
            background: #2a201d;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 1.2em;
            margin-bottom: 1em;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
        }
        .empty { color: #9aa6b2; text-align: center; padding: 2em; background: #2a201d; border-radius: 12px; grid-column: 1 / -1; }
        .pedido-info, .pedido-itens, .pedido-total { margin-bottom: 10px; }
        .pedido-info strong, .pedido-total strong { color: #fff; }
        .pedido-itens ul { list-style: none; padding-left: 0; margin: 5px 0 0 0; }
        .pedido-itens li { padding: 4px 0; border-bottom: 1px solid #333; }
        .pedido-footer { display: flex; gap: 10px; justify-content: flex-end; align-items: center; margin-top: auto; padding-top: 15px; }
        .btn {
            padding: 8px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: transform .1s ease;
        }
        .btn:active{ transform: scale(0.96); }
        .btn-imprimir { background-color: #07fcdb; color: #1A1210; }
        .btn-imprimir:hover { filter: brightness(0.9); }
        .btn-cancelar { background-color: #ac940d; color: white; }
        .btn-cancelar:hover { filter: brightness(0.9); }

        /* Estilos para Impressão */
        @media print {
            body { background: #fff; color: #000; }
            body * { visibility: hidden; }
            #area-impressao, #area-impressao * { visibility: visible; }
            #area-impressao { position: absolute; left: 0; top: 0; width: 100%; }
            .pedido { box-shadow: none; border: 1px solid #000; background: #fff; color: #000; }
             h3, .pedido-info strong, .pedido-total strong { color: #000; }
            .btn { display: none; }
        }
    </style>
</head>
<body>
    <h1>Painel de Pedidos</h1>
    <div id="lista"></div>

    <div id="area-impressao" aria-hidden="true"></div>

    <template id="tpl">
        <div class="pedido">
            <h3>Pedido #<span class="pid"></span></h3>
            <div class="pedido-info">
                <div><strong>Data:</strong> <span class="pdata"></span></div>
                <div><strong>Cliente:</strong> <span class="pcliente-nome"></span></div>
                <div><strong>Endereço:</strong> <span class="pcliente-endereco"></span></div>
                <div><strong>Pagamento:</strong> <span class="ppagamento"></span></div>
            </div>
            <div class="pedido-itens">
                <strong>Itens:</strong>
                <ul class="pitens-lista"></ul>
            </div>
            <div class="pedido-total">
                <div>Subtotal: <span class="psubtotal"></span></div>
                <div>Taxa de entrega: <span class="ptaxa"></span></div>
                <strong>Total: <span class="ptotal"></span></strong>
            </div>
            <div class="pedido-footer">
                <button class="btn btn-imprimir">Imprimir</button>
                <button class="btn btn-cancelar">Finalizar</button>
            </div>
        </div>
    </template>

    <!-- O SCRIPT AGORA É UM MÓDULO PARA USAR OS IMPORTS DO FIREBASE -->
    <script type="module">
        // Importa as funções necessárias do Firebase a partir da CDN oficial
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, deleteDoc, addDoc, query, where, getDocs, serverTimestamp, orderBy } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore.js";

        // SUA CONFIGURAÇÃO DO FIREBASE (JÁ INSERIDA)
        const firebaseConfig = {
            apiKey: "AIzaSyDV9tPC5XNNmB_REgW1au2NtpP1ETtV1i0",
            authDomain: "paineldepedidos-8cfff.firebaseapp.com",
            projectId: "paineldepedidos-8cfff",
            storageBucket: "paineldepedidos-8cfff.appspot.com",
            messagingSenderId: "390619980929",
            appId: "1:390619980929:web:5bb015938e9dcb89389980",
            measurementId: "G-CMH7LSQ7C0"
        };
        // ------------------------------------

        // Inicializa o Firebase e o Firestore
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Referência às "coleções" (pastas) de pedidos no banco de dados
        const pedidosCol = collection(db, 'pedidos');
        const arquivadosCol = collection(db, 'pedidos_arquivados');

        const listaEl = document.getElementById('lista');
        const tpl = document.getElementById('tpl');

        function money(v) { return 'R$ ' + Number(v).toFixed(2).replace('.', ','); }

        // NOVA FUNÇÃO: arquivarPedidosAntigos com Firebase
        async function arquivarPedidosAntigos() {
            const HORA_ARQUIVAMENTO_MS = 12 * 60 * 60 * 1000;
            const tempoLimite = new Date(Date.now() - HORA_ARQUIVAMENTO_MS);

            const q = query(pedidosCol, where("criadoEm", "<", tempoLimite));

            const snapshot = await getDocs(q);
            if (snapshot.empty) {
                console.log("Nenhum pedido antigo para arquivar.");
                return;
            }

            for (const documento of snapshot.docs) {
                console.log(`Arquivando pedido #${documento.id}...`);
                const dados = documento.data();
                dados.arquivadoEm = serverTimestamp(); // Adiciona data de arquivamento
                await addDoc(arquivadosCol, dados);
                await deleteDoc(doc(db, 'pedidos', documento.id));
            }
        }

        // FUNÇÃO ATUALIZADA: carregarPedidos com Firebase em TEMPO REAL!
        function carregarPedidos() {
            // Cria uma query para ordenar os pedidos do mais novo para o mais antigo
            const q = query(pedidosCol, orderBy("criadoEm", "desc"));

            // onSnapshot "ouve" as mudanças na coleção em tempo real.
            onSnapshot(q, (snapshot) => {
                listaEl.innerHTML = '';

                if (snapshot.empty) {
                    listaEl.innerHTML = '<p class="empty">Nenhum pedido novo.</p>';
                    return;
                }

                snapshot.forEach(documento => {
                    const p = documento.data(); // p são os dados do pedido
                    const id = documento.id;    // id é o identificador único do pedido

                    const node = tpl.content.cloneNode(true);
                    const pedidoDiv = node.querySelector('.pedido');
                    pedidoDiv.id = `pedido-${id}`;

                    const dataPedido = p.criadoEm ? new Date(p.criadoEm.seconds * 1000).toLocaleString('pt-BR') : 'Data não informada';

                    node.querySelector('.pid').textContent = id.substring(0, 6).toUpperCase();
                    node.querySelector('.pdata').textContent = dataPedido;
                    node.querySelector('.pcliente-nome').textContent = p.cliente.nome;
                    node.querySelector('.pcliente-endereco').textContent = `Rua ${p.cliente.rua}, Nº ${p.cliente.numero} - ${p.cliente.bairro}`;

                    let pagamentoTxt = p.pagamento;
                    if (p.pagamento === 'Dinheiro' && p.troco) {
                        pagamentoTxt += ` (Troco para: ${money(p.troco)})`;
                    }
                    node.querySelector('.ppagamento').textContent = pagamentoTxt;

                    const itensUl = node.querySelector('.pitens-lista');
                    if(p.itens && p.itens.forEach) {
                        p.itens.forEach(item => {
                            const li = document.createElement('li');
                            li.textContent = `${item.qty}x ${item.title} - ${money(item.price * item.qty)}`;
                            itensUl.appendChild(li);
                        });
                    }

                    node.querySelector('.psubtotal').textContent = money(p.subtotal);
                    node.querySelector('.ptaxa').textContent = money(p.taxa);
                    node.querySelector('.ptotal').textContent = money(p.total);

                    node.querySelector('.btn-imprimir').onclick = () => imprimirPedido(id);
                    node.querySelector('.btn-cancelar').onclick = () => finalizarPedido(id);

                    listaEl.appendChild(node);
                });
            });
        }

        function imprimirPedido(pedidoId) {
            const areaImpressao = document.getElementById('area-impressao');
            const conteudoPedido = document.getElementById(`pedido-${pedidoId}`).cloneNode(true);
            conteudoPedido.querySelector('.pedido-footer').remove();
            areaImpressao.innerHTML = '';
            areaImpressao.appendChild(conteudoPedido);
            window.print();
        }

        // FUNÇÃO ATUALIZADA: finalizarPedido com Firebase
        async function finalizarPedido(pedidoId) {
            if (!confirm(`Tem certeza que deseja FINALIZAR e remover o pedido #${pedidoId.substring(0,6).toUpperCase()} da tela?`)) {
                return;
            }
            try {
                // Apaga o documento com o ID correspondente da coleção "pedidos"
                await deleteDoc(doc(db, 'pedidos', pedidoId));
                 console.log(`Pedido ${pedidoId} finalizado com sucesso.`);
                // Não precisa chamar carregarPedidos()! O onSnapshot faz isso sozinho.
            } catch (e) {
                console.error("Erro ao finalizar pedido: ", e);
                alert("Ocorreu um erro ao tentar finalizar o pedido.");
            }
        }

        // Código que roda quando a página carrega
        document.addEventListener('DOMContentLoaded', () => {
            arquivarPedidosAntigos(); // Faz uma limpeza inicial
            carregarPedidos(); // Começa a "ouvir" por novos pedidos
            // Não precisamos mais do setInterval e do 'storage' event listener!
        });

    </script>
</body>
</html>
